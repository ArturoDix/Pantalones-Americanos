<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Pantalones Americanos</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"><style id="app-style">
/* Layout: denim-twill header band with brass rivets and Rye wordmark; size-guide strip; category tabs; filter rail + product grid. Owner panel swaps in under the same band. */
:root{
  --bg:#efede9;--surface:#ffffff;--sunk:#e6e2db;--ink:#1f1b17;--muted:#6c645b;--line:#dcd5cb;
  --denim:#1f3354;--denim-2:#2c4670;--leather:#8b5a2b;--leather-ink:#f6e8d6;--brass:#a8823a;--thread:#c98a3a;--alert:#a3352b;--ok:#3d7a4f;
  --band:#18263f;--band-ink:#f3eee6;
  --f-mark:"Rye","Bevan",Georgia,serif;
  --f-head:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519;--surface:#1b2027;--sunk:#232a33;--ink:#efe9e0;--muted:#a69e93;--line:#2f3743;
  --denim:#9fb6dc;--denim-2:#7f9bc9;--leather:#a8713f;--leather-ink:#fbeedd;--brass:#d4b066;--thread:#e0a55a;--alert:#ec8a7f;--ok:#7cc493;
  --band:#0d1626;--band-ink:#f3eee6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121519;--surface:#1b2027;--sunk:#232a33;--ink:#efe9e0;--muted:#a69e93;--line:#2f3743;
  --denim:#9fb6dc;--denim-2:#7f9bc9;--leather:#a8713f;--leather-ink:#fbeedd;--brass:#d4b066;--thread:#e0a55a;--alert:#ec8a7f;--ok:#7cc493;
  --band:#0d1626;--band-ink:#f3eee6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
/* ---------- band ---------- */
.band{position:relative;background:var(--band);color:var(--band-ink);
  background-image:repeating-linear-gradient(120deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px),radial-gradient(ellipse at 80% -20%,rgba(201,138,58,.22),transparent 60%);
  border-bottom:3px solid var(--leather)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:6px;border-bottom:2px dashed var(--thread);opacity:.75}
.band .wrap{padding-block:26px 30px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.mark{display:flex;flex-direction:column;gap:6px;min-width:0}
.mark small{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--thread)}
.mark h1{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(30px,6.4vw,58px);line-height:1;letter-spacing:.01em;text-wrap:balance}
.mark p{margin:0;font-size:14px;opacity:.82;max-width:52ch}
.rivets{display:flex;gap:10px;align-items:center}
.rivet{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4dc9c,#a8823a 60%,#6d5220);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.navtabs{display:flex;gap:6px;flex-wrap:wrap}
.navtab{background:transparent;border:1px solid rgba(243,238,230,.28);color:var(--band-ink);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500}
.navtab[aria-pressed="true"]{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
/* ---------- size guide ---------- */
.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;padding:14px 18px}
.guide svg{width:92px;height:auto;grid-row:span 2}
.guide h2{margin:0;font-family:var(--f-head);font-weight:600;font-size:19px}
.guide p{margin:0;font-size:14px;color:var(--muted);max-width:70ch}
.guide b{color:var(--ink)}
.conv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);grid-column:2}
.conv input{width:86px}
.conv output{font-family:var(--f-mono);color:var(--ink);font-weight:500}
@media(max-width:560px){.guide{grid-template-columns:1fr}.guide svg{display:none}.conv{grid-column:1}}
/* ---------- tabs & toolbar ---------- */
.cats{display:flex;gap:4px;overflow-x:auto;margin-top:18px;border-bottom:1px solid var(--line)}
.catbtn{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-family:var(--f-head);font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap}
.catbtn small{font-family:var(--f-mono);font-size:11px;font-weight:500;margin-left:4px;opacity:.8}
.catbtn[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--leather)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px 12px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.in,.select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--denim);border-color:var(--denim);color:var(--surface)}
.btn.leather{background:var(--leather);border-color:var(--leather);color:var(--leather-ink)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--alert)}
.only-m{display:inline-flex}
.layout{display:grid;grid-template-columns:1fr;gap:22px;padding-bottom:56px}
@media(min-width:900px){.layout{grid-template-columns:250px 1fr}.only-m{display:none}}
/* ---------- filters ---------- */
.filters{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;align-self:start}
.filters.open{display:block}
@media(min-width:900px){.filters{display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.facet{padding-block:12px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.facet:last-child{border-bottom:0}
.facet h4{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.4}
.chip.m{font-family:var(--f-mono);font-size:12px;border-radius:7px;padding:4px 8px}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--surface)}
.note{font-size:12px;color:var(--muted);margin:0}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.count{font-size:13px;color:var(--muted);margin:0 0 12px}
/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pic{position:relative;border:0;padding:0;width:100%;aspect-ratio:5/4;max-width:100%;display:grid;place-items:center;background:var(--sunk);overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 1px,transparent 1px 5px)}
.pic img{width:100%;height:100%;object-fit:cover}
.garment{position:relative;height:78%;max-width:70%}
.garment .fill,.garment svg{position:absolute;inset:0;width:100%;height:100%}
.garment .fill{background:var(--fill);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.garment svg{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.8;stroke-dasharray:2 2}
.patch{position:absolute;left:12px;top:12px;background:var(--leather);color:var(--leather-ink);font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px 3px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 0 0 3px var(--leather),inset 0 0 0 4px rgba(246,232,214,.35)}
.tier{position:absolute;right:12px;top:12px;font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--surface);color:var(--ink);padding:3px 8px;border-radius:5px;border:1px solid var(--line)}
.flag{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface);color:var(--alert)}
.cbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cbody h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:20px;line-height:1.15;text-wrap:balance}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--fill);padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--thread)}
.dotname{font-size:12px;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.sz{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border-radius:5px;padding:2px 6px}
.sz.last{background:color-mix(in srgb,var(--thread) 22%,var(--sunk))}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.price{font-family:var(--f-head);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;line-height:1.2}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;padding-top:20px}
.foot{border-top:1px dashed var(--line);padding-block:18px 28px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px}
/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.58);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:720px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media(min-width:720px){.sheet{border-radius:18px}}
.sheet .pic{aspect-ratio:16/9}
.sheet-in{padding:18px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet h2{margin:0;font-family:var(--f-head);font-size:28px;line-height:1.1}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px}
.swatch i{width:20px;height:20px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--thread);box-shadow:0 0 0 1px var(--thread)}
.mx{overflow-x:auto}
table.matrix{border-collapse:separate;border-spacing:4px;font-family:var(--f-mono);font-size:12px}
.matrix th{color:var(--muted);font-weight:500;padding:2px 4px;white-space:nowrap}
.cell{min-width:46px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-size:12px;padding:0 8px}
.cell.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.cell.low{background:color-mix(in srgb,var(--thread) 18%,var(--surface));border-color:color-mix(in srgb,var(--thread) 50%,var(--line))}
.cell.none{opacity:.3}
.cell[aria-pressed="true"]{outline:2px solid var(--denim);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--k)}
.msg{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sib{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ---------- owner ---------- */
.subtabs{display:flex;gap:2px;overflow-x:auto;padding-top:16px;border-bottom:1px solid var(--line)}
.subtab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;font-weight:500;color:var(--muted);white-space:nowrap;font-size:14px}
.subtab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--leather)}
.subtab .badge{font-family:var(--f-mono);font-size:11px;background:var(--alert);color:var(--surface);border-radius:999px;padding:0 6px;margin-left:4px}
.panel{padding-block:20px 130px;display:flex;flex-direction:column;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile em{font-style:normal;font-size:12px;color:var(--ok)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.li:first-child{border-top:0}
.li .r{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:170px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar .v{width:100%;max-width:34px;background:var(--denim-2);border-radius:4px 4px 0 0;position:relative}
.bar .g{position:absolute;left:0;right:0;bottom:0;background:var(--thread);border-radius:0}
.bar small{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.bar .n{font-size:10px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.bar[aria-current="true"] small{color:var(--ink);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td.num{text-align:right;font-family:var(--f-mono)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp-h{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;background:none;border:0;text-align:left;flex-wrap:wrap}
.grp-h .sw{width:34px;height:34px;border-radius:8px;background:var(--fill);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.grp-h .t{flex:1 1 220px;min-width:0}
.grp-h .t b{display:block;font-size:15px}
.grp-h .t span{font-size:12px;color:var(--muted)}
.grp-h .k{font-family:var(--f-mono);font-size:13px;text-align:right}
.grp-b{border-top:1px dashed var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--sunk) 40%,var(--surface))}
.colhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colhead .sw{width:22px;height:22px;border-radius:50%;background:var(--fill)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form label.wide{grid-column:1/-1}
textarea.in{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
.found{border:2px solid var(--thread);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;font-size:13px}
.kv div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.pill.warn{color:var(--alert)}
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--band);color:var(--band-ink);border-top:2px dashed var(--thread);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

 const lim=new Date();lim.setFullYear(lim.getFullYear()-1);const limS=lim.toISOString().slice(0,10);const old=P.filter(p=>p.fc&&p.fc>'2000'&&p.fc<limS);const oldBy={};old.forEach(p=>{const k=brandLab(p)+' · '+p.e;oldBy[k]=(oldBy[k]||0)+1;});const oldL=Object.entries(oldBy).sort((a,b)=>b[1]-a[1]).slice(0,6);

const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const xMarca=p=>p.m==="Levi's"?('Levis'+(p.ln?' '+p.ln:'')):(p.m+(p.ln?' '+p.ln:''));
function xRows(){const r=[];const y=today().slice(0,4);
 allSales().filter(p=>p._m.startsWith(y)).forEach(p=>r.push([p.no,p.pr,dmy(p.fc),dmy(p.fv),xMarca(p),p.e,p.c,p.t,p.u,'-','-',p.pc,p.pv,(+p.pv||0)-(+p.pc||0),p.pv,p.pv,'Vendido pagado',MESL[+p._m.slice(5)-1]]));
 O.pieces.forEach(p=>r.push([p.no,p.pr,dmy(p.fc),'',xMarca(p),p.e,p.c,p.t,p.u,'','',p.pc,p.pv,(+p.pv||0)-(+p.pc||0),'','','','']));
 O.rev.forEach(p=>r.push([p.no,p.pr,dmy(p.fc),'',xMarca(p),p.e,p.c,p.t,p.nota,'','',p.pc,p.pv,'','','','','']));
 return r.sort((a,b)=>(+a[0]||1e9)-(+b[0]||1e9));}
function pExcel(){const imp=ui.imp;return `<div class="box"><h3>Exportar a Excel</h3><p class="note">Mismas columnas que tu pestaña “2026”: primero lo vendido del año y después la existencia, ordenado por número. Pégalo en una hoja nueva como respaldo o para seguir trabajando en Excel.</p>
 <div class="actions"><button class="btn primary" data-act="xcopy">Copiar para pegar en Excel</button><button class="btn" data-act="xdl">Descargar CSV</button></div></div>
 <div class="box"><h3>Agregar compras desde Excel</h3><p class="note">Si capturaste compras nuevas en Excel, copia esos renglones con las columnas de la pestaña “2026” (desde <b>No</b> hasta <b>Precio Venta</b>) y pégalos aquí. Se agregan solo los números que todavía no existen.</p>
 <textarea class="in" id="imp" data-bind="imp" placeholder="No	Proveedor	Fecha Compra	…">${esc(ui.b.imp||'')}</textarea>
 <div class="actions"><button class="btn" data-act="impread">Revisar</button></div>
 ${imp?`<p class="note">${imp.add.length} piezas nuevas · ${imp.dup} ya existían · ${imp.bad} renglones incompletos o ya vendidos.</p><div class="actions"><button class="btn leather" data-act="impok" ${ui.busy||!imp.add.length?'disabled':''}>Agregar ${imp.add.length} piezas</button><button class="btn ghost" data-act="impno">Cancelar</button></div>`:''}</div>`;}
function pAjustes(){const c=O.cfg;const b=ui.b;const v=(k,d)=>esc(b['cf.'+k]??d??'');return `<div class="box"><h3>Datos de la tienda</h3><p class="note">Se muestran a los clientes en el catálogo.</p><div class="form">
 <label>Nombre<input class="in" id="cf-nombre" data-bind="cf.nombre" value="${v('nombre',c.nombre)}"></label><label>WhatsApp con lada (ej. 528112345678)<input class="in" id="cf-whatsapp" data-bind="cf.whatsapp" inputmode="tel" value="${v('whatsapp',c.whatsapp)}"></label>
 <label>Horario<input class="in" id="cf-horario" data-bind="cf.horario" value="${v('horario',c.horario)}" placeholder="Sáb y Dom · 9:00 a 15:00"></label><label>Ubicaciones (separadas por coma)<input class="in" id="cf-ub" data-bind="cf.ub" value="${v('ub',(c.ubicaciones||[]).join(', '))}"></label>
 <label class="wide">Lema<input class="in" id="cf-lema" data-bind="cf.lema" value="${v('lema',c.lema)}"></label></div><div class="actions"><button class="btn primary" data-act="cfsave" ${ui.busy?'disabled':''}>Guardar</button></div></div>`;}

/* ---------- writes ---------- */
let q=Promise.resolve();
function run(fn,okMsg){ui.busy=true;render();q=q.then(fn).then(()=>{if(okMsg)toast(okMsg);}).catch(e=>{const c=e&&e.code;toast(c==='quota_exceeded'?'Se llenó el espacio de la base de datos.':c==='invalid_argument'?'No tienes permiso para guardar o el dato es inválido.':'No se pudo guardar ('+(c||'error')+'). Intenta de nuevo.');}).finally(()=>{ui.busy=false;render();});return q;}
const saveChunk=(id,arr)=>db.doc('inv/'+id).set({p:arr.map(pick)});
async function patchPieces(nos,fn){const by={};nos.forEach(no=>{const p=O.byNo.get(String(no));if(p)(by[p._c]=by[p._c]||[]).push(String(no));});
 for(const id of Object.keys(by)){const set=new Set(by[id]);const arr=[];(O.chunks[id]||[]).forEach(r=>{if(set.has(String(r.no))){const n=fn(Object.assign({},r));if(n)arr.push(n);}else arr.push(r);});await saveChunk(id,arr);}}
async function addPieces(list){let ids=Object.keys(O.chunks).sort();let id=ids.find(i=>(O.chunks[i]||[]).length+list.length<=320);
 if(!id){id='c'+String(ids.length?(+ids[ids.length-1].slice(1)+1):0).padStart(2,'0');O.chunks[id]=[];}
 await saveChunk(id,(O.chunks[id]||[]).concat(list));}
async function saveCfg(patch){const c=Object.assign({},O.cfg,patch);await db.doc('cfg/tienda').set(c);}
function sell(no){const p=O.byNo.get(String(no));if(!p)return;const s=ui.sell;const fv=s.fv||today();const u=s.u||p.u||(O.cfg.ubicaciones||[])[0]||'';const pv=+(s.pv||p.pv)||0;
 run(async()=>{const mk=fv.slice(0,7);const rec=Object.assign(pick(p),{fv,u,pv});await patchPieces([no],()=>null);await db.doc('ventas/'+mk).set({p:(O.ventas[mk]||[]).concat([rec])});ui.sell={no:'',u:'',pv:'',fv:''};},`Venta registrada: No. ${no}`);}
function undo(no,mk){const arr=O.ventas[mk]||[];const rec=arr.find(x=>String(x.no)===String(no));if(!rec)return;
 run(async()=>{await db.doc('ventas/'+mk).set({p:arr.filter(x=>x!==rec)});const r=pick(rec);delete r.fv;r.pv=O.byNo.size?r.pv:r.pv;await addPieces([r]);},`Venta deshecha: No. ${no} regresó al inventario`);}

/* ---------- publish catálogo ---------- */
async function publishCat(){if(!artifact){toast('Esta vista no puede publicar.');return;}
 const json=JSON.stringify(O.live).replace(/</g,'\\u003c');
 const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+'<style id="app-style">'+$('app-style').textContent+'</style><div id="app"></div><script type="application/json" id="pub">'+json+SC+'<script id="core">'+$('core').textContent+SC+'<script id="app-js">'+$('app-js').textContent+SC+'</body></html>';
 try{sessionStorage.setItem('vista',JSON.stringify({view:ui.view,sub:ui.sub}));}catch(e){}
 ui.busy=true;render();
 try{await artifact.publish(html);toast('Catálogo publicado');}catch(e){const c=e&&e.code;ui.busy=false;
  toast(c==='conflict'?'Alguien publicó antes; se cargará su versión.':c==='not_writer'||c==='not_granted'?'Tu acceso no permite publicar.':c==='rate_limited'?'Espera un momento y vuelve a intentar.':'No se pudo publicar ('+(c||'error')+').');render();}}

/* ---------- misc ---------- */
let tt;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},3000);}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado');}catch(_){toast('Selecciona y copia el texto manualmente');}ta.remove();}}
async function shrink(file){try{const bmp=await createImageBitmap(file);const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.85));}catch(e){return file;}}
function parseImport(txt){const ex=new Set([...O.byNo.keys(),...allSales().map(p=>String(p.no)),...O.rev.map(p=>String(p.no))]);let dup=0,bad=0;const add=[];
 const dt=s=>{s=String(s||'').trim();let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[0]:null;};
 const num=s=>{const n=+String(s||'').replace(/[^\d.]/g,'');return n||null;};
 txt.split(/\r?\n/).forEach((l,i)=>{if(!l.trim())return;const c=l.split('\t').map(x=>x.trim());if(i===0&&/^no$/i.test(c[0]))return;
  const [no,pr,fc,fv,marca,e,col,t,u,,,pc,pv]=c;if(!no||!marca||!e||!t||(fv&&fv!=='-')){bad++;return;}if(ex.has(String(+no||no))){dup++;return;}
  const mm=/^levi'?s\s*(.*)$/i.exec(marca);add.push({no:+no||no,pr:(pr||'').toUpperCase(),fc:dt(fc),m:mm?"Levi's":marca,ln:mm?mm[1]:'',e:e.replace(/\s+/g,' '),c:col||'',t:C.normT(t),u:u||'',pc:num(pc),pv:num(pv)});ex.add(String(+no||no));});
 return {add,dup,bad};}

/* ---------- render ---------- */
function render(){const S=src();const a=document.activeElement;const fid=a&&a.id;let pos=null;try{pos=a&&a.selectionStart;}catch(e){}
 $('app').innerHTML=`<header class="band"><div class="wrap"><div class="mark"><small><span class="rivets"><i class="rivet"></i>&nbsp;Ropa vaquera americana original&nbsp;<i class="rivet"></i></span></small><h1>${esc(S.tienda.nombre)}</h1><p>${esc(S.tienda.lema)}</p></div>
 ${owner?`<nav class="navtabs"><button class="navtab" aria-pressed="${ui.view==='catalogo'}" data-act="view" data-k="catalogo">Catálogo</button><button class="navtab" aria-pressed="${ui.view==='tienda'}" data-act="view" data-k="tienda">Mi tienda</button></nav>`:''}</div></header>
 ${owner&&ui.view==='tienda'?viewTienda():viewCatalogo()}${ui.detail?viewDetail():''}
 ${owner&&O.ready&&O.dirty?`<div class="pubbar"><span>Hay cambios que tus clientes todavía no ven en el catálogo.</span><button class="btn leather small" data-act="publish" ${ui.busy?'disabled':''}>Publicar catálogo</button></div>`:''}`;
 if(fid){const el=$(fid);if(el&&el!==document.body){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act;if(a==='close'&&e.target!==b)return;const d=b.dataset;
 switch(a){
 case 'f':{const s=ui.f[d.k];s.has(d.v)?s.delete(d.v):s.add(d.v);if('w l let'.includes(d.k))saveTalla();ui.limit=36;break;}
 case 'unf':ui.f[d.k].delete(d.v);saveTalla();break;
 case 'clear':Object.values(ui.f).forEach(s=>s.clear());ui.q='';saveTalla();break;
 case 'cat':ui.cat=d.k;ui.limit=36;break;
 case 'togF':ui.showF=!ui.showF;break;
 case 'more':ui.limit+=36;break;
 case 'usew':ui.f.w.clear();ui.f.w.add(String(d.v));ui.cat=ui.cat==='Camisa'?'Todo':ui.cat;saveTalla();break;
 case 'col':ui.sel[d.k]=+d.i;ui.pick=null;break;
 case 'open':{ui.detail=d.k;ui.pick=null;const card=src().cards.find(c=>c.k===d.k);if(card&&ui.sel[d.k]==null){const cs=visible(card);if(cs)ui.sel[d.k]=cs[0].i;}break;}
 case 'close':case 'x':ui.detail=null;ui.pick=null;break;
 case 'pick':ui.pick=d.t;break;
 case 'copy':copy(d.t);return;
 case 'view':ui.view=d.k;break;
 case 'sub':ui.sub=d.k;break;
 case 'publish':publishCat();return;
 case 'sell':sell(d.no);return;
 case 'undo':undo(d.no,d.m);return;
 case 'gosell':ui.sub='vender';ui.sell={no:String(d.no),u:'',pv:'',fv:''};break;
 case 'gopiece':{const p=O.byNo.get(String(d.no));if(p){ui.sub='inventario';ui.inv.q=String(d.no);ui.inv.open=C.cardKey(p);ui.inv.edit=String(d.no);}break;}
 case 'gopen':ui.inv.open=ui.inv.open===d.k?null:d.k;ui.inv.edit=null;break;
 case 'invmore':ui.inv.limit+=40;break;
 case 'gprice':{const g=O.groups.find(x=>x.k===d.k);const v=+ui.inv.price[d.k];if(!g||!(v>0)){toast('Escribe un precio válido');return;}
  run(()=>patchPieces(g.items.map(p=>p.no),r=>Object.assign(r,{pv:v})),`Precio actualizado a ${money(v)}`).then(()=>{ui.inv.open=null;});return;}
 case 'pedit':ui.inv.edit=String(d.no);['t','u','c','pc','pv'].forEach(k=>delete ui.b['pe.'+k]);ui.conf=null;break;
 case 'pcancel':ui.inv.edit=null;break;
 case 'psave':{const B=ui.b;run(()=>patchPieces([d.no],r=>{if(B['pe.t']!=null)r.t=C.normT(B['pe.t']);if(B['pe.u']!=null)r.u=B['pe.u'];if(B['pe.c']!=null)r.c=B['pe.c'].trim();if(B['pe.pc']!=null)r.pc=+B['pe.pc']||null;if(B['pe.pv']!=null)r.pv=+B['pe.pv']||null;return r;}),'Pieza actualizada').then(()=>{ui.inv.edit=null;});return;}
 case 'pdel':ui.conf='del'+d.no;break;
 case 'pdel-ok':run(()=>patchPieces([d.no],()=>null),`No. ${d.no} quitado del inventario`).then(()=>{ui.inv.edit=null;ui.conf=null;});return;
 case 'buy':{const B=ui.b;const ts=compraTallas();const e2=String(B['cp.e']||'').trim().replace(/\s+/g,' ');const m2=String(B['cp.m']||'').trim();
  if(!m2||!e2||!B['cp.c']){toast('Faltan marca, estilo o color');return;}if(!(+B['cp.pv']>0)){toast('Falta el precio de venta');return;}
  const mm=/^levi'?s\s*(.*)$/i.exec(m2);const n0=nextNo();const list=ts.map((t,i)=>({no:n0+i,pr:String(B['cp.pr']||'').trim().toUpperCase(),fc:B['cp.fc']||today(),m:mm?"Levi's":m2,ln:mm?(mm[1]||String(B['cp.ln']||'').trim()):String(B['cp.ln']||'').trim(),e:e2,c:String(B['cp.c']).trim(),t,u:B['cp.u']||(O.cfg.ubicaciones||[])[0]||'',pc:+B['cp.pc']||null,pv:+B['cp.pv']}));
  run(async()=>{await addPieces(list);await saveCfg({nextNo:n0+list.length});['cp.t','cp.c'].forEach(k=>delete ui.b[k]);},`Compra guardada: etiquetas ${n0}${list.length>1?'–'+(n0+list.length-1):''}`);return;}
 case 'buyclear':Object.keys(ui.b).filter(k=>k.startsWith('cp.')).forEach(k=>delete ui.b[k]);break;
 case 'mes':ui.mes=d.k;break;
 case 'revback':{const p=O.rev.find(x=>String(x.no)===String(d.no));if(!p)return;const r=pick(p);delete r.nota;run(async()=>{await addPieces([r]);await db.doc('revisar/lista').set({p:O.rev.filter(x=>x!==p).map(pick)});},`No. ${d.no} regresó al inventario`);return;}
 case 'revdel':ui.conf='rev'+d.no;break;
 case 'revdel-ok':{const p=O.rev.find(x=>String(x.no)===String(d.no));run(()=>db.doc('revisar/lista').set({p:O.rev.filter(x=>x!==p).map(pick)}),'Quitado').then(()=>{ui.conf=null;});return;}
 case 'xcopy':copy([XCOLS,...xRows()].map(r=>r.map(x=>x??'').join('\t')).join('\n'));return;
 case 'xdl':(async()=>{const dlc=window.claude&&await window.claude.use('downloads');if(!dlc){toast('La descarga no está disponible aquí; usa “Copiar”.');return;}
  const qq=x=>{x=String(x??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;};try{await dlc.save({filename:'Lista_Pant_'+today()+'.csv',data:'﻿'+[XCOLS,...xRows()].map(r=>r.map(qq).join(',')).join('\n')});}catch(err){toast('Descarga cancelada');}})();return;
 case 'impread':ui.imp=parseImport(ui.b.imp||'');break;
 case 'impno':ui.imp=null;break;
 case 'impok':{const list=ui.imp.add;run(async()=>{await addPieces(list);ui.imp=null;ui.b.imp='';},`${list.length} piezas agregadas`);return;}
 case 'cfsave':{const B=ui.b,c=O.cfg;const g=(k,d)=>B['cf.'+k]!=null?String(B['cf.'+k]).trim():d;
  run(()=>saveCfg({nombre:g('nombre',c.nombre),lema:g('lema',c.lema),horario:g('horario',c.horario),whatsapp:g('whatsapp',c.whatsapp||'').replace(/\D/g,''),ubicaciones:g('ub',(c.ubicaciones||[]).join(', ')).split(',').map(s=>s.trim()).filter(Boolean)}),'Datos guardados');return;}
 default:return;}
 render();});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){ui.q=t.value;ui.limit=36;render();return;}
 if(t.id==='invq'){ui.inv.q=t.value;ui.inv.limit=40;render();return;}
 if(t.id==='sellno'){ui.sell={no:t.value.trim(),u:'',pv:'',fv:''};render();return;}
 const k=t.dataset.bind;if(!k)return;
 if(k.startsWith('sell.'))ui.sell[k.slice(5)]=t.value;else if(k.startsWith('inv.price.'))ui.inv.price[k.slice(10)]=t.value;else ui.b[k]=t.value;
 if(k==='cm'||k==='cp.t'||k==='cp.m'||k.startsWith('sell.'))render();});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='sort'){ui.sort=t.value;render();}else if(t.id==='invcat'){ui.inv.cat=t.value;render();}else if(t.id==='invu'){ui.inv.u=t.value;render();}
 else if(t.dataset.bind&&t.tagName==='SELECT'){const k=t.dataset.bind;if(k.startsWith('sell.'))ui.sell[k.slice(5)]=t.value;else ui.b[k]=t.value;}
 else if(t.dataset.act==='foto'&&t.files&&t.files[0]){const pk=t.dataset.pk;const f=t.files[0];
  run(async()=>{const as=await window.claude.use('assets');if(!as)throw {code:'assets'};const blob=await shrink(f);const r=await as.upload(blob);const fotos=Object.assign({},O.cfg.fotos,{[pk]:r.url});await saveCfg({fotos});},'Foto guardada. Publica el catálogo para que la vean tus clientes.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.detail){ui.detail=null;render();}});

render();
(async()=>{if(!window.claude)return;try{
 const [u,a,d]=await Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('db')]);artifact=a;
 canEdit=u?await u.canEdit():false;if(!canEdit||!d){if(ui.view==='tienda'){ui.view='catalogo';render();}return;}
 db=d;owner=true;render();
 db.collection('inv').onSnapshot(s=>{O.chunks={};s.docs.forEach(x=>{O.chunks[x.id]=(x.data()||{}).p||[];});O.got.inv=true;rebuild();render();},()=>{});
 db.collection('ventas').onSnapshot(s=>{O.ventas={};s.docs.forEach(x=>{O.ventas[x.id]=(x.data()||{}).p||[];});O.got.ventas=true;render();},()=>{});
 db.doc('cfg/tienda').onSnapshot(s=>{O.cfg=s.exists?s.data():{nombre:PUB.tienda.nombre,lema:PUB.tienda.lema,whatsapp:'',horario:'',ubicaciones:PUB.tienda.ubicaciones||[],fotos:{},nextNo:1};O.got.cfg=true;rebuild();render();},()=>{});
 db.doc('revisar/lista').onSnapshot(s=>{O.rev=s.exists?((s.data()||{}).p||[]).map(C.enrich):[];O.got.rev=true;render();},()=>{});
}catch(e){}})();
})();
</script></body></html>
